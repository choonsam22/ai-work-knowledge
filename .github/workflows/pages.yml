name: Deploy executive benchmarking report

on:
  push:
    branches: [main]
    paths:
      - "synthesis/site/**"
      - "synthesis/claude/2026-08-12-final-strategy.html"
      - "synthesis/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build separate report URLs
        shell: bash
        run: |
          mkdir -p _site/claude _site/codex
          cp synthesis/pages/index.html _site/index.html
          cp synthesis/claude/2026-08-12-final-strategy.html _site/claude/index.html
          cp synthesis/site/index.html _site/codex/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
